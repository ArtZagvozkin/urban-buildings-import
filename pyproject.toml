[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-buildings-import"
version = "1.0.0"
description = "Проверка и контролируемый импорт зданий в URBAN API"
requires-python = ">=3.11"
dependencies = [
  "pyproj>=3.7,<4",
  "requests>=2.32,<3",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
package = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
include = ["urban_import*"]

[tool.setuptools.package-data]
urban_import = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
